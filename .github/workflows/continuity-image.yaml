name: Continuity Server Image

# Publishes the continuity server as a prebuilt image so users deploy with one
# `docker run` instead of cloning the repository. Rebuilt on every push that
# touches continuity-server/, and can be dispatched on demand.

on:
  push:
    branches: [main]
    paths:
      - 'continuity-server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: continuity-server
          push: true
          tags: >-
            ghcr.io/${{ github.repository_owner }}/jellybox-continuity:latest,
            ghcr.io/${{ github.repository_owner }}/jellybox-continuity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

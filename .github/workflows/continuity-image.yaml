name: Continuity Server Image

# Publishes the continuity server as a prebuilt image so users deploy with one
# `docker run` instead of cloning the repository. Rebuilt on every push that
# touches continuity-server/, and can be dispatched on demand.

on:
  push:
    branches: [main]
    paths:
      - 'continuity-server/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase owner segments, and the account login is
      # "Nreel", so the tag must be lowercased here.
      - name: Resolve image name
        run: echo "IMAGE=ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/jellybox-continuity" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: continuity-server
          push: true
          tags: >-
            ghcr.io/${{ github.repository_owner }}/jellybox-continuity:latest,
            ghcr.io/${{ github.repository_owner }}/jellybox-continuity:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

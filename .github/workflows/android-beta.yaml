name: Android Release

# Called by the Release workflow, which creates the release and passes the
# version and the tag to attach the universal APK to. Can also be dispatched on
# its own to rebuild or backfill the APK.
#
# No Play Store listing: there is no upload key here, so gradle's release
# buildType falls back to the debug keystore (android/app/build.gradle) and the
# attached APK is debug-signed. Play rejects unsigned APKs, and an unsigned APK
# is not installable, so debug signing is the smallest honest build.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
      release_tag:
        description: Existing release (draft or published) to attach the APK to
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach the APK to: a tag, "latest", or blank to only build'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # On a standalone dispatch both stay unset and flutter stamps the
      # pubspec's own version and build number.
      - name: Resolve version
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$IN_VERSION" ]; then
            ARGS="$ARGS --build-name=$IN_VERSION"
          fi
          if [ -n "$IN_BUILD_NUMBER" ]; then
            ARGS="$ARGS --build-number=$IN_BUILD_NUMBER"
          fi
          echo "APK_BUILD_ARGS=$ARGS" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Private package
        uses: ./.github/actions/optional-features
        with:
          deploy-key: ${{ secrets.OPTIONAL_FEATURES_DEPLOY_KEY }}

      - name: Build universal APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release $APK_BUILD_ARGS
          mkdir -p build/app/outputs/universal
          cp build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/universal/jellybox-universal.apk

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: ./.github/actions/release-assets
        with:
          release-tag: ${{ inputs.release_tag }}
          files: build/app/outputs/universal/jellybox-universal.apk
          token: ${{ secrets.GITHUB_TOKEN }}

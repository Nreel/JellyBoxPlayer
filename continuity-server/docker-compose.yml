services:
  continuity:
    build: .
    container_name: jellybox-continuity
    ports:
      - "8000:8000"
    environment:
      CONTINUITY_DB: /data/continuity.db
    volumes:
      - continuity-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  continuity-data:

org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
# AGP 9 keeps the legacy DSL / external Kotlin plugin so the Flutter Gradle
# plugin stays compatible; both flags are removed once AGP 10 lands.
android.builtInKotlin=false
android.newDsl=false
# Kotlin's incremental cache (.tab files) is registered per compile daemon,
# which Android Studio also drives; two daemons opening the same cache throw
# "Storage ... is already registered" and fail the build. The Kotlin sources
# here are small, so non-incremental compiles are cheaper than the flakiness.
kotlin.incremental=false

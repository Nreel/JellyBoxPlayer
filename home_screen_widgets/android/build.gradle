group = "com.prodigytech.home_screen_widgets"
version = "1.0"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP and KGP come from the app project's settings.gradle plugin block;
// pinning a buildscript classpath here would collide with the app's versions.
apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.prodigytech.home_screen_widgets"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

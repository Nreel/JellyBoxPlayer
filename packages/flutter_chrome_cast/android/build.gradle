group 'com.felnanuke.google_cast'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP and KGP come from the app project's settings.gradle plugin block;
// pinning a buildscript classpath here would collide with the app's versions.
apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.felnanuke.google_cast"
    compileSdk = 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.mediarouter:mediarouter:1.4.0'
    implementation 'com.google.android.gms:play-services-cast-framework:21.5.0'
    api 'com.google.code.gson:gson:2.10.1'
}
